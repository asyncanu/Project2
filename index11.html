<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width : 100vw;
            height : 100vh;
            background-color: beige;
            border: 5px solid black;
        }

        .box{
            width:350px;
            height:80px;
            background-color:blue;
            border-radius:10px;
            border:3px solid yellow;
            margin:10px;
            position:relative;
            animation-name: rightMovement;
             animation: 5s linear 1s infinite alternate none running rightMovement;
        }
            /* animation-duration: 5s;
            animation-iteration-count: 2; */ 
            /* animation-delay: 2s; */
            /* animation-timing-function : linear; */
            /* animation-direction: alternate; */
            /* animation-fill-mode : backwards; */
            /* @keyframes duration | easing-function | delay | iteration count | direction | fill-mode | play-state | name */
           
        

        @keyframes rightMovement{
            from{
                top:0;
                left: 0;}
            to{
                top:0;
                left: 1350px;}}
        
            @keyframes leftMovement{
            from{
                top: 500px;
                left: 1350px;}
            to{
                top: 500px;
                left: 0px;}
        }

        #box2{
            width:350px;
            height:80px;
            background-color:blue;
            border-radius:10px;
            border:3px solid yellow;
            margin:10px;
            position:relative;
            animation: 5s linear 1s infinite alternate none running leftMovement;
        }

        #circle{
            width:100px;
            height:100px;
            background-color: orange;
            border-radius: 50px;
            border:3px solid yellow;
            margin: 10px;
            position:relative;
            top : 2%;
            left : 30%;
            animation: 8s ease-in-out 0s infinite alternate-reverse none running circleMovement;
        }

         @keyframes circleMovement{
            0%{
                top : 1%;
            left : 4%;
            }

             10%{
                top : 4%;
            left : 40%;
            }

             40%{
                top : 40%;
            left : 10%;
            }

             90%{
                top : 40%;
            left : 30%;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box">
        </div>

        <div id="box2">
        </div>

        <div id="circle">
        </div>
    </div>
</body>
</html>
